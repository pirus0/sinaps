<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#efebe2">
  <meta name="description" content="Düz yazı notlarını dallandır. Verilerin cihazında kalır.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dallanan Not">
  <title>Dallanan Not</title>
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script>
    try { const theme = localStorage.getItem('dallanan-not-theme');
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark' ? theme :
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch {}
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main id="app">
    <header id="header"></header>
    <div id="content"></div>
    <footer id="toolbar"></footer>
  </main>
  <dialog id="sheet" aria-labelledby="sheet-title">
    <div id="sheet-handle"><span></span></div>
    <header class="sheet-header"><h2 id="sheet-title"></h2><button id="close-sheet" class="icon-button" aria-label="Kapat"></button></header>
    <div id="sheet-content"></div>
  </dialog>
  <aside id="notice" role="status" aria-live="polite" hidden></aside>
  <p id="save-error" role="alert" hidden></p>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <noscript>Notlarını açmak için JavaScript'i etkinleştir.</noscript>
</body>
</html>
